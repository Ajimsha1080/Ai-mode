name: CI Quality, Security & Acceptance Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-and-typecheck:
    name: Python Lint, Typecheck & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx
          pip install -r python-backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check python-backend/

      - name: Run Mypy Typecheck
        run: |
          mypy python-backend/app --ignore-missing-imports

  python-backend-tests:
    name: Python Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aaas_enterprise_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-backend/requirements.txt

      - name: Run Pytest Suite (Unit + Parity + Integration + Acceptance)
        env:
          APP_ENV: dev
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword123@localhost:5432/aaas_enterprise_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest python-backend/ -v

  node-lint-build-and-evals:
    name: Next.js Build, Acceptance & Agentic Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Set up Python 3.12 for Agent Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-backend/requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Storefront & BFF
        run: npm run build
        env:
          NODE_ENV: production
          APP_ENV: production
          DATABASE_URL: postgresql+asyncpg://postgres:fake@localhost:5432/fake
          REDIS_URL: redis://localhost:6379/0
          SESSION_JWT_SECRET: supersecret32characterlongproductionjwtsigningsecret!
          SERVICE_JWT_PRIVATE_KEY: ${{ secrets.SERVICE_JWT_PRIVATE_KEY || 'fake_key_for_build' }}
          ENCRYPTION_KEY: supersecret32characterlongencryptionkey!

      - name: Run Acceptance Test Suite (33/33)
        run: npm run test:acceptance

      - name: Run Agentic Commerce Evaluation Suite (61/61)
        run: npm run test:agentic

  security-container-scan:
    name: Container Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Python Backend Image
        run: |
          docker build -t shopmate-python-backend:latest ./python-backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'shopmate-python-backend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
