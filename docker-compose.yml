services:
  # 1. Python FastAPI AI Engine Backend
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: shopmate-python-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - APP_ENV=${APP_ENV:-production}
      - SERVICE_JWT_PUBLIC_KEY=${SERVICE_JWT_PUBLIC_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./python-backend/data:/app/data

  # 2. Next.js Frontend & Storefront
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopmate-frontend
    restart: always
    ports:
      - "3000:3000"
      - "80:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - APP_ENV=${APP_ENV:-production}
      - PORT=3000
      - PYTHON_BACKEND_URL=http://python-backend:8000
      - SESSION_JWT_SECRET=${SESSION_JWT_SECRET}
      - SERVICE_JWT_PRIVATE_KEY=${SERVICE_JWT_PRIVATE_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-sarvam}
      - LLM_MODEL=${LLM_MODEL:-sarvam-105b-conversations}
      - AUTH_COOKIE_NAME=aaas_session_token
    depends_on:
      - python-backend
    volumes:
      - ./data:/app/data
