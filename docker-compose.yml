services:
  # 1. PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopmate-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aaas_enterprise}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aaas_enterprise}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopmate_network

  # 2. Redis 7 Distributed Cache, Sessions & Rate Limiter with Password Auth
  redis:
    image: redis:7-alpine
    container_name: shopmate-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - shopmate_network

  # 3. Python FastAPI AI Engine & Backend of Record
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: shopmate-python-backend
    restart: always
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB:-aaas_enterprise}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SERVICE_JWT_PUBLIC_KEY=${SERVICE_JWT_PUBLIC_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./python-backend/data:/app/data
    networks:
      - shopmate_network

  # 4. Next.js Frontend Storefront & BFF Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopmate-frontend
    restart: always
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => {if (r.statusCode !== 200) process.exit(1);})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - APP_ENV=${APP_ENV:-production}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHON_BACKEND_URL=http://python-backend:8000
      - SESSION_JWT_SECRET=${SESSION_JWT_SECRET}
      - SERVICE_JWT_PRIVATE_KEY=${SERVICE_JWT_PRIVATE_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-sarvam}
      - LLM_MODEL=${LLM_MODEL:-sarvam-105b-conversations}
      - AUTH_COOKIE_NAME=aaas_session_token
    depends_on:
      python-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopmate_network

  # 5. Reverse Proxy with TLS Termination (Only Service Publishing External Ports)
  reverse-proxy:
    image: nginx:alpine
    container_name: shopmate-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      python-backend:
        condition: service_healthy
    networks:
      - shopmate_network

networks:
  shopmate_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
